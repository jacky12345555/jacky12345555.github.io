                            </div>
                        )}

                        {/* ================= STREAMING_CHUNK: 第二部分 (PART 2) ================= */}
                        {activeTab === 'part2' && (
                            <div className="space-y-8 animate-fadeIn">
                                {/* 概念 Header */}
                                <div className="bg-emerald-50 border border-emerald-200 rounded-2xl p-6 sm:p-8">
                                    <div className="flex items-center space-x-3 text-emerald-700 font-bold text-sm mb-2">
                                        <span>PART 02</span>
                                        <span>•</span>
                                        <span>概念解析</span>
                                    </div>
                                    <h2 className="text-2xl sm:text-3xl font-extrabold text-slate-900 mb-4">
                                        站到困境之上：二元對立與「勇猛一躍」
                                    </h2>
                                    <blockquote className="italic border-l-4 border-emerald-500 pl-4 py-2 text-slate-700 bg-white/60 rounded-r-lg mb-4">
                                        「眼前有兩條路這個『相』，是我們自己執著建構出來的……如同先挖兩個坑，然後告訴自己，除了選擇其中一個坑跳進去之外，別無他法。若是運用不執著的智慧，我們就會勇猛一躍，跳到相對的兩邊之上，超越兩邊，看到另一條無限寬廣的道路。」
                                    </blockquote>
                                    <p className="text-slate-600 text-sm sm:text-base leading-relaxed">
                                        脫離困境的方法是<strong>「站到困境之上」</strong>。當我們深陷於「A vs. B」非黑即白的二元對立，只會在自己建構的死胡同裡轉圈。
                                    </p>
                                </div>

                                {/* 互動模擬器 */}
                                <div className="glass-card rounded-2xl p-6 sm:p-8 border border-slate-200">
                                    <h3 className="text-xl font-bold text-slate-900 mb-2">【例子中的概念】二元對立解套模擬器</h3>
                                    <p className="text-xs text-slate-500 mb-6">點擊切換不同生活情境，查看如何跳出自己挖的坑</p>

                                    {/* 切換頁籤 */}
                                    <div className="flex flex-wrap gap-2 mb-6">
                                        {part2Scenarios.map((sc, idx) => (
                                            <button
                                                key={idx}
                                                onClick={() => setActiveScenario(idx)}
                                                className={`px-4 py-2 rounded-xl text-sm font-bold transition-all flex items-center space-x-2 ${
                                                    activeScenario === idx 
                                                    ? 'bg-emerald-600 text-white shadow-md' 
                                                    : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                                                }`}>
                                                <span>{sc.icon}</span>
                                                <span>{sc.title.split('：')[0]}</span>
                                            </button>
                                        ))}
                                    </div>

                                    {/* 模擬器展示區 */}
                                    <div className="space-y-6">
                                        <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                                            <h4 className="font-bold text-slate-800 text-lg mb-1">{part2Scenarios[activeScenario].title}</h4>
                                            <p className="text-xs text-red-500 font-semibold mb-3">陷阱原因：{part2Scenarios[activeScenario].trap}</p>
                                            
                                            {/* 兩個坑 (二元選項) */}
                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 my-4">
                                                <div className="p-4 rounded-xl bg-red-50 border border-red-200 text-red-900 text-sm">
                                                    <span className="font-bold block mb-1">坑 1：執著建構的選項 A</span>
                                                    {part2Scenarios[activeScenario].optionA}
                                                </div>
                                                <div className="p-4 rounded-xl bg-orange-50 border border-orange-200 text-orange-900 text-sm">
                                                    <span className="font-bold block mb-1">坑 2：執著建構的選項 B</span>
                                                    {part2Scenarios[activeScenario].optionB}
                                                </div>
                                            </div>
                                        </div>

                                        {/* 勇猛一躍 */}
                                        <div className="p-6 rounded-2xl bg-gradient-to-r from-emerald-600 to-teal-600 text-white shadow-lg glow-emerald">
                                            <div className="flex items-center space-x-2 text-emerald-200 text-xs font-bold uppercase tracking-wider mb-2">
                                                <span>✨ Jump Above Duality</span>
                                                <span>•</span>
                                                <span>超越兩邊</span>
                                            </div>
                                            <h5 className="text-xl font-bold mb-3">勇猛一躍：超越兩邊的「第三條路」</h5>
                                            <p className="text-sm sm:text-base leading-relaxed bg-white/10 p-4 rounded-xl backdrop-blur-md border border-white/10">
                                                {part2Scenarios[activeScenario].jumpAction}
                                            </p>
                                        </div>
                                    </div>
                                </div>

                                {/* 結論 */}
                                <div className="bg-gradient-to-r from-emerald-600 to-teal-700 text-white rounded-2xl p-6 sm:p-8 shadow-lg">
                                    <h3 className="text-lg font-bold mb-2">📌 第二部分結論</h3>
                                    <p className="text-base sm:text-lg leading-relaxed font-medium">
                                        世上本沒有走不通的路，只有被執著封閉的心。認清眼前選擇只是自己建構的「相」，<strong>敢於跳出對立框架，就能看見寬廣無限的新出路</strong>。
                                    </p>
                                </div>
                            </div>
                        )}

                        {/* ================= STREAMING_CHUNK: 第三部分 (PART 3) ================= */}
                        {activeTab === 'part3' && (
                            <div className="space-y-8 animate-fadeIn">
                                {/* 概念 Header */}
                                <div className="bg-indigo-50 border border-indigo-200 rounded-2xl p-6 sm:p-8">
                                    <div className="flex items-center space-x-3 text-indigo-700 font-bold text-sm mb-2">
                                        <span>PART 03</span>
                                        <span>•</span>
                                        <span>概念解析</span>
                                    </div>
                                    <h2 className="text-2xl sm:text-3xl font-extrabold text-slate-900 mb-4">
                                        真正的被理解與「照亮盲點」
                                    </h2>
                                    <blockquote className="italic border-l-4 border-indigo-500 pl-4 py-2 text-slate-700 bg-white/60 rounded-r-lg mb-4">
                                        「被人理解就代表你的價值被看到，也被肯定。不過，真正讓我們感動的理解，不是別人瞭解我們自己已經知道的，而是別人瞭解了連我們自己都說不明白的。這樣的理解，是我們透過對方的眼睛，看到真實的自己。」
                                    </blockquote>
                                    <p className="text-slate-600 text-sm sm:text-base leading-relaxed">
                                        真正的理解不是「被看穿的難堪」，而是一種「終於被安放的解脫」。這能帶領我們跨越自我的盲區。
                                    </p>
                                </div>

                                {/* 互動周哈里窗 (Johari Window) 矩陣 */}
                                <div className="glass-card rounded-2xl p-6 sm:p-8 border border-slate-200">
                                    <h3 className="text-xl font-bold text-slate-900 mb-2">【例子中的概念】周哈里窗（Johari Window）互動解析</h3>
                                    <p className="text-xs text-slate-500 mb-6">點擊四個區域，了解自我認識的層次與《金剛經》覺照</p>

                                    {/* 2x2 矩陣 */}
                                    <div className="grid grid-cols-2 gap-3 sm:gap-4 max-w-2xl mx-auto mb-6">
                                        <div 
                                            onClick={() => setActiveJohari('open')}
                                            className={`p-4 rounded-xl cursor-pointer border transition-all text-center ${
                                                activeJohari === 'open' 
                                                ? 'bg-indigo-600 text-white border-indigo-600 shadow-md scale-105' 
                                                : 'bg-white text-slate-700 border-slate-200 hover:bg-indigo-50'
                                            }`}>
                                            <div className="text-xs font-semibold opacity-80 mb-1">自己知道 / 他人知道</div>
                                            <div className="font-bold text-base">開放自我 (Open)</div>
                                        </div>

                                        <div 
                                            onClick={() => setActiveJohari('blind')}
                                            className={`p-4 rounded-xl cursor-pointer border transition-all text-center ${
                                                activeJohari === 'blind' 
                                                ? 'bg-indigo-600 text-white border-indigo-600 shadow-md scale-105 glow-indigo' 
                                                : 'bg-white text-slate-700 border-slate-200 hover:bg-indigo-50'
                                            }`}>
                                            <div className="text-xs font-semibold opacity-80 mb-1">自己不知道 / 他人知道</div>
                                            <div className="font-bold text-base">盲目自我 (Blind) 🌟</div>
                                        </div>

                                        <div 
                                            onClick={() => setActiveJohari('hidden')}
                                            className={`p-4 rounded-xl cursor-pointer border transition-all text-center ${
                                                activeJohari === 'hidden' 
                                                ? 'bg-indigo-600 text-white border-indigo-600 shadow-md scale-105' 
                                                : 'bg-white text-slate-700 border-slate-200 hover:bg-indigo-50'
                                            }`}>
                                            <div className="text-xs font-semibold opacity-80 mb-1">自己知道 / 他人不知道</div>
                                            <div className="font-bold text-base">隱密自我 (Hidden)</div>
                                        </div>

                                        <div 
                                            onClick={() => setActiveJohari('unknown')}
                                            className={`p-4 rounded-xl cursor-pointer border transition-all text-center ${
                                                activeJohari === 'unknown' 
                                                ? 'bg-indigo-600 text-white border-indigo-600 shadow-md scale-105' 
                                                : 'bg-white text-slate-700 border-slate-200 hover:bg-indigo-50'
                                            }`}>
                                            <div className="text-xs font-semibold opacity-80 mb-1">自己不知道 / 他人不知道</div>
                                            <div className="font-bold text-base">未知自我 (Unknown)</div>
                                        </div>
                                    </div>

                                    {/* 矩陣細節展示 */}
                                    <div className="bg-indigo-50/70 p-5 rounded-2xl border border-indigo-100">
                                        {activeJohari === 'blind' && (
                                            <div className="space-y-3">
                                                <h4 className="font-bold text-indigo-900 text-lg">🔍 關鍵核心：盲目自我（Blind Self）</h4>
                                                <p className="text-slate-700 text-sm leading-relaxed">
                                                    你自己看不到，但別人卻看得一清二楚的地方。當有人用充滿善意與洞察的方式指出盲點時，那一瞬間「盲點被點亮了」，帶給我們靈魂深處被安放的解脫感！
                                                </p>
                                            </div>
                                        )}
                                        {activeJohari === 'open' && (
                                            <div className="space-y-2">
                                                <h4 className="font-bold text-indigo-900 text-lg">開放自我 (Open Self)</h4>
                                                <p className="text-slate-700 text-sm">你自己知道，大家也知道的外顯部分（如：職稱、身高、顯性個性）。大多數人日常社交只肯定這一區域。</p>
                                            </div>
                                        )}
                                        {activeJohari === 'hidden' && (
                                            <div className="space-y-2">
                                                <h4 className="font-bold text-indigo-900 text-lg">隱密自我 (Hidden Self)</h4>
                                                <p className="text-slate-700 text-sm">你自己知道但未對外公開的秘密、恐懼與脆弱。</p>
                                            </div>
                                        )}
                                        {activeJohari === 'unknown' && (
                                            <div className="space-y-2">
                                                <h4 className="font-bold text-indigo-900 text-lg">未知自我 (Unknown Self)</h4>
                                                <p className="text-slate-700 text-sm">潛藏在無意識中，尚未被你自己與他人發掘的潛能或深層議題。</p>
                                            </div>
                                        )}
                                    </div>
                                </div>

                                {/* 生活中的三面鏡子與心態培養 */}
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div className="glass-card p-6 rounded-2xl border border-slate-200">
                                        <h3 className="font-bold text-slate-800 text-lg mb-4 flex items-center space-x-2">
                                            <span>🪞 生活中能成為盲點鏡子的人</span>
                                        </h3>
                                        <ul className="space-y-3 text-sm text-slate-600">
                                            <li className="bg-slate-50 p-3 rounded-xl">
                                                <strong className="text-indigo-700 block mb-1">1. 極高洞察力的知己/伴侶：</strong>
                                                觀察你的防衛機制，提醒：「你不是在堅持原則，你只是害怕失去控制後的失落感。」
                                            </li>
                                            <li className="bg-slate-50 p-3 rounded-xl">
                                                <strong className="text-indigo-700 block mb-1">2. 高品質導師與長輩：</strong>
                                                站在更高的高度點出：「你的能力早就夠了，你真正的瓶頸是太害怕失敗，不敢承擔責任。」
                                            </li>
                                            <li className="bg-slate-50 p-3 rounded-xl">
                                                <strong className="text-indigo-700 block mb-1">3. 討厭/衝突的人（負面鏡子）：</strong>
                                                心理學「投射效應」：我們對他人的強烈厭惡，往往源於對方展現了我們極力壓抑的自己。
                                            </li>
                                        </ul>
                                    </div>

                                    <div className="glass-card p-6 rounded-2xl border border-slate-200">
                                        <h3 className="font-bold text-slate-800 text-lg mb-4 flex items-center space-x-2">
                                            <span>💡 如何吸收並接納盲點指引</span>
                                        </h3>
                                        <ul className="space-y-3 text-sm text-slate-600">
                                            <li className="bg-slate-50 p-3 rounded-xl">
                                                <strong className="text-indigo-700 block mb-1">1. 保持低防禦率：</strong>
                                                放下大腦第一時間辯解的防衛罩，允許自己「可能不夠了解自己」。
                                            </li>
                                            <li className="bg-slate-50 p-3 rounded-xl">
                                                <strong className="text-indigo-700 block mb-1">2. 主動尋找真誠反饋 (Radical Candor)：</strong>
                                                主動問值得信任的人：「你覺得我在這件事上，有沒有我自己沒注意到的盲區？」
                                            </li>
                                            <li className="bg-slate-50 p-3 rounded-xl">
                                                <strong className="text-indigo-700 block mb-1">3. 從情緒震顫中覺察：</strong>
                                                當某句話讓你內心震顫或有些羞恥感時，往往就是「盲點被揭開」的訊號。
                                            </li>
                                        </ul>
                                    </div>
                                </div>

                                {/* 結論 */}
                                <div className="bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-2xl p-6 sm:p-8 shadow-lg">
                                    <h3 className="text-lg font-bold mb-2">📌 第三部分結論</h3>
                                    <p className="text-base sm:text-lg leading-relaxed font-medium">
                                        這段話最動人的地方在於：<br/>
                                        <span className="text-xl font-black text-indigo-100 mt-1 block">
                                            「真正的理解，不是將我們定型，而是帶我們超越自我。」
                                        </span>
                                    </p>
                                </div>
                            </div>
                        )}

                    </main>

                    {/* 頁尾 */}
                    <footer className="mt-auto border-t border-slate-200 bg-white py-6 text-center text-xs text-slate-400">
                        <p>依據《王思迅金剛經白話講座》心得打造之現代互動簡報 • 靈性、智慧與超越</p>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
